[project]
name = "mcp-server-unified"
version = "1.0.0"
# NOTE: Originally forked from an early MotherDuck MCP server implementation (MIT).
# This project has since significantly diverged: unified plugin architecture, USITC
# tariff data ingestion, enhanced safety, and general-purpose dataset tooling.
description = "Unified MCP server (diverged fork) with DuckDB/MotherDuck support and specialized USITC tariff data tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "model context protocol", "duckdb", "motherduck", "tariff", "usitc", "data", "sql", "plugin"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
 "duckdb>=0.9.0",
 "tabulate>=0.9.0",
 "click>=8.1.8",
 "starlette>=0.46.1",
 "uvicorn>=0.34.0",
 "anyio>=4.8.0",
 "mcp>=1.9.4",
 "pytz>=2025.2",
 "pandas>=1.5.0",
 "requests>=2.28.0",
 "openpyxl>=3.0.0",
 "xlrd>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0", 
    "pytest-cov>=4.0.0",
]

[[project.authors]]
name = "jmabry"
email = "your-email@example.com"



[project.urls]
Homepage = "https://github.com/jmabry/mcp-tarrifs"
Source = "https://github.com/jmabry/mcp-tarrifs"
Issues = "https://github.com/jmabry/mcp-tarrifs/issues"
OriginalUpstream = "https://github.com/motherduckdb/mcp-server-motherduck"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[project.scripts]
mcp-server-unified = "mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (end-to-end workflows)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
